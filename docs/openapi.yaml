openapi: 3.1.0
info:
  title: Free Lunch Hunter API
  version: 1.0.0
  description: >-
    Same-origin, session-authenticated community points API. Points are not money.
    Paths are relative to the PHP document root. Register and log in through the
    HTML forms, retaining cookies, then request resource=session for a CSRF token.
    This is not yet a partner API or payment-provider integration.
servers:
  - url: http://localhost:8080
paths:
  /api.php:
    get:
      summary: Read health, session, wallet, or membership orders
      description: >-
        Only resource=health is public. Other resources require the flh_session
        cookie and return only the authenticated account's data. Wallet history
        is limited to 50 entries; order history to 20 orders, newest first.
        Health performs a real database query and returns 500 if it fails.
      security:
        - sessionCookie: []
        - {}
      parameters:
        - name: resource
          in: query
          required: true
          schema:
            type: string
            enum: [health, session, wallet, membership-orders]
      responses:
        '200':
          description: The selected resource
          headers:
            X-Request-ID:
              schema: {type: string}
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [status]
                    properties:
                      status: {const: ok}
                  - type: object
                    required: [user, csrf_token]
                    properties:
                      user:
                        type: object
                        description: Account ID, username, email, membership level, and balance; no password.
                      csrf_token: {type: string}
                  - type: object
                    required: [balance, unit, entries]
                    properties:
                      balance: {type: string, example: '35.00'}
                      unit: {const: community_points}
                      entries:
                        type: array
                        items:
                          type: object
                          properties:
                            entry_id: {type: integer}
                            amount: {type: string}
                            action: {type: string}
                            reference: {type: string}
                            created_at: {type: string, description: 'Local database DATETIME, YYYY-MM-DD HH:MM:SS'}
                  - type: object
                    required: [orders]
                    properties:
                      orders:
                        type: array
                        items: {$ref: '#/components/schemas/Order'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
    post:
      summary: Redeem 30 community points for Premium
      description: >-
        The product and price are server-controlled. On the first valid request,
        order creation, ledger debit, balance update, and entitlement activation
        commit together. Retrying the same account-scoped key returns its original
        order with 200 even after membership activation. A different key after
        activation or insufficient balance returns 409 without a debit.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: resource
          in: query
          required: true
          schema: {const: membership-orders}
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9_-]{16,80}$'
          description: Retain this key when retrying the same purchase.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product_code]
              properties:
                product_code: {const: premium_lifetime}
      responses:
        '201':
          description: New completed order
          headers:
            Idempotency-Replayed:
              schema: {type: string, enum: ['false']}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrderResult'}
        '200':
          description: Original order returned; no additional debit
          headers:
            Idempotency-Replayed:
              schema: {type: string, enum: ['true']}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrderResult'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: flh_session
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
  schemas:
    Order:
      type: object
      required: [order_id, product_code, amount, status, created_at]
      properties:
        order_id: {type: string, pattern: '^[a-f0-9]{32}$'}
        product_code: {const: premium_lifetime}
        amount: {type: string, example: '30.00'}
        status: {const: completed}
        created_at: {type: string, description: 'Local database DATETIME, YYYY-MM-DD HH:MM:SS'}
    OrderResult:
      type: object
      required: [order, replayed]
      properties:
        order: {$ref: '#/components/schemas/Order'}
        replayed: {type: boolean}
    Error:
      type: object
      required: [error, request_id]
      properties:
        error: {type: string}
        request_id: {type: string}
  responses:
    Error:
      description: Safe error message with request correlation ID
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
